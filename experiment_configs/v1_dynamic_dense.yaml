experiment:
  duration_sec: 120
  id_format: "%Y%m%d-%H%M%S"

scenario:
  type: dynamic_obstacle_dense

scheduler:
  impl: critical_first_fifo
  window_ms: 50

trigger:
  impl: hybrid
  cooldown_windows: 10

agent:
  enabled_task_types:
    - LOCAL_TOOL

agent_workload:
  generator: poisson
  seed: 42
  local_tool:
    lambda_per_sec: 4.0
    max_arrivals_per_window: 8

execution:
  cmd_vel_topic: /cmd_vel
  stop_on_non_run: true
  mapping:
    critical:
      linear_x: 0.20
      angular_z: 0.00
    high:
      linear_x: 0.12
      angular_z: 0.15
    best_effort:
      linear_x: 0.08
      angular_z: -0.10
    fallback:
      linear_x: 0.10
      angular_z: 0.00

sim:
  world_name: dynamic_obstacle_dense
  physics_step_ms: 1

vee:
  apply_to:
    - runtime_scheduler
    - robot_control
    - agent_workers
  enforcement_required: true
  profile: edge_box_small
  cpu:
    cpuset: "0-7"
    quota: "600000 1000000"
  memory:
    high: "6G"
    max: "8G"
  gpu:
    provider: hami-core

trace:
  root_dir: traces
